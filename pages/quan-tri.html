<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Quản trị — Trợ Lý Giáo Viên Hoá Học</title>
<meta name="theme-color" content="#0d9488" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="stylesheet" href="../css/style.css" />
<script>window.APP_BASE_PATH = '../';</script>
</head>
<body>

<header class="app-header">
  <a class="back-btn" href="../index.html" aria-label="Quay lại">←</a>
  <h1>Quản trị</h1>
</header>

<main id="adminMain">
  <div class="card">
    <div class="free-mode-row" style="margin:0;padding:10px 12px;">
      <div class="fm-text">
        <div class="fm-title">Công tắc tổng — Chiến dịch kinh doanh</div>
        <div class="fm-sub">Bật: áp dụng giới hạn gói miễn phí, hiện nút nâng cấp. Tắt: mọi người dùng như bản miễn phí, không giới hạn gì.</div>
      </div>
      <div class="switch" id="monetizationEnabledToggle"><div class="knob"></div></div>
    </div>
  </div>

  <div class="section-label">Chức năng quản trị</div>
  <div class="action-grid">
    <button class="btn admin-menu-btn" type="button" data-section="stats">📈 Thống kê nhanh</button>
    <button class="btn admin-menu-btn" type="button" data-section="roster">👥 Danh sách giáo viên</button>
    <button class="btn admin-menu-btn" type="button" data-section="locked">🔒 Khoá tính năng</button>
    <button class="btn admin-menu-btn" type="button" data-section="plans">💳 Gói &amp; giá</button>
    <button class="btn admin-menu-btn" type="button" data-section="payment">🏦 Chuyển khoản</button>
    <button class="btn admin-menu-btn" type="button" data-section="pending">🧾 Duyệt thanh toán<span class="admin-menu-badge" id="pendingCountBadge" style="display:none;"></span></button>
    <button class="btn admin-menu-btn" type="button" data-section="commissions">💰 Hoa hồng cần trả</button>
    <button class="btn admin-menu-btn" type="button" data-section="rateHistory">📜 Lịch sử % hoa hồng</button>
  </div>

  <div id="adminSectionPanel" style="display:none;margin-top:12px;"></div>
</main>

<script src="../js/app.js"></script>
<script src="../js/vendor/firebase/firebase-app-compat.js"></script>
<script src="../js/vendor/firebase/firebase-auth-compat.js"></script>
<script src="../js/vendor/firebase/firebase-firestore-compat.js"></script>
<script src="../js/features/firebase-init.js"></script>
<script src="../js/features/auth.js"></script>
<script src="../js/features/monetization.js"></script>
<script src="../js/features/admin.js"></script>
</body>
</html>
