<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hồ sơ giáo viên — Trợ Lý Giáo Viên Hoá Học</title>
<meta name="theme-color" content="#0d9488" />
<link rel="manifest" href="../manifest.json" />
<link rel="icon" href="../icons/icon-192.png" />
<link rel="stylesheet" href="../css/style.css" />
<script>window.APP_BASE_PATH = '../';</script>
</head>
<body>

<header class="app-header">
  <a class="back-btn" href="../index.html" aria-label="Quay lại">←</a>
  <h1>Hồ sơ giáo viên</h1>
</header>

<main>
  <div class="card">
    <h2><span class="icon">🙍</span>Thông tin cá nhân</h2>
    <p class="hint" style="margin-top:-4px;">Tên và ảnh này hiện ở các trang giáo viên trong app để cá nhân hoá — học sinh không nhìn thấy.</p>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:16px;">
      <div id="profilePhotoPreview" style="width:88px;height:88px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;"></div>
      <div class="btn-row">
        <button class="btn" id="profilePhotoBtn" type="button">🖼️ Đổi ảnh</button>
        <button class="btn" id="profilePhotoResetBtn" type="button">Dùng lại ảnh Google</button>
      </div>
      <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;" />
    </div>

    <div class="field">
      <label for="profileName">Tên hiển thị</label>
      <input type="text" id="profileName" placeholder="VD: Thầy Chính" />
    </div>
    <div class="field">
      <label for="profileWorkplace">Đơn vị công tác</label>
      <input type="text" id="profileWorkplace" placeholder="VD: Trường Quân sự Quân đoàn 34" />
    </div>
    <div class="field">
      <label for="profileBio">Giới thiệu ngắn</label>
      <textarea id="profileBio" rows="3" placeholder="VD: Giáo viên Hoá học, phụ trách khối 10-12"></textarea>
    </div>

    <button class="btn primary block" id="profileSaveBtn">Lưu hồ sơ</button>
    <div class="result-box" id="profileResult"></div>
  </div>
</main>

<script src="../js/app.js"></script>
<script src="../js/vendor/firebase/firebase-app-compat.js"></script>
<script src="../js/vendor/firebase/firebase-auth-compat.js"></script>
<script src="../js/vendor/firebase/firebase-firestore-compat.js"></script>
<script src="../js/features/firebase-init.js"></script>
<script src="../js/features/auth.js"></script>
<script src="../js/features/teacher-profile.js"></script>
</body>
</html>
